<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Raffles Go</title>
    <link rel="icon" type="image/png" href="src/assets/images/icons/icon.png">
    <link rel="stylesheet" href="src/assets/styles/main.css">
    <meta name="theme-color" content="#2d5a27">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <img src="src/assets/images/icons/icon.png" alt="Raffles Go Logo" class="auth-logo">
                <h1>Raffles Go</h1>
                <p class="auth-subtitle">Conservation Volunteer Platform</p>
            </div>

            <!-- Login Form -->
            <form class="auth-form" id="loginForm">
                <h2>Sign In</h2>
                
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" name="email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" required autocomplete="current-password">
                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Remember me</span>
                    </label>
                </div>

                <button type="submit" class="btn-primary btn-full">Sign In</button>

                <div class="auth-divider">
                    <span>Don't have an account?</span>
                </div>

                <button type="button" class="btn-secondary btn-full" id="showRegisterBtn">Create Account</button>
            </form>

            <!-- Register Form (Hidden by default) -->
            <form class="auth-form" id="registerForm" style="display: none;">
                <h2>Create Account</h2>
                
                <div class="form-group">
                    <label for="registerName">Full Name</label>
                    <input type="text" id="registerName" name="name" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <input type="email" id="registerEmail" name="email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" name="password" required autocomplete="new-password" minlength="8">
                    <small class="form-hint">At least 8 characters</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn-primary btn-full">Create Account</button>

                <div class="auth-divider">
                    <span>Already have an account?</span>
                </div>

                <button type="button" class="btn-secondary btn-full" id="showLoginBtn">Sign In</button>
            </form>
        </div>

        <footer class="auth-footer">
            <p>&copy; 2024 Raffles Go. Protecting endangered primates through community collaboration.</p>
        </footer>
    </div>

    <script src="src/assets/scripts/utils.js"></script>
    <script src="src/assets/scripts/storage.js"></script>
    <script src="src/assets/scripts/auth.js"></script>
</body>
</html>
